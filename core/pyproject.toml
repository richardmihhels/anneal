[project]
name = "anneal-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "anneal-shared",
    "asyncpg>=0.29",
    "clickhouse-connect>=0.7",
    "scikit-learn>=1.3",
    "numpy>=1.26",
    "anthropic>=0.40",
    "typer>=0.12",
    "rich>=13",
    "scipy>=1.10",
    "dspy>=3.2.1",
]

[project.scripts]
anneal = "core.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]

[tool.uv.sources]
anneal-shared = { workspace = true }
