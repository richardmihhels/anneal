[project]
name = "anneal-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "anneal-shared",
    "apscheduler>=3.11.2",
    "anneal-core",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.uv.sources]
anneal-shared = { workspace = true }
anneal-core = { workspace = true }
