services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: anneal
      POSTGRES_USER: anneal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anneal}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  clickhouse:
    image: clickhouse/clickhouse-server:24
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse

volumes:
  postgres_data:
  clickhouse_data:
