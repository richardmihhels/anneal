version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
    groups:
      dashboard-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /core
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /worker
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /dashboard
    schedule:
      interval: monthly

  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: monthly
