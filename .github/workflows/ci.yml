name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python — lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Audit production dependencies
        run: |
          uv export --quiet --frozen --no-dev --all-packages --all-extras --no-emit-workspace \
            --format requirements-txt --output-file /tmp/anneal-requirements.txt
          # diskcache has no patched release for PYSEC-2026-2447. Anneal disables
          # DSPy's disk cache before use; see GEPAMutator and SECURITY.md.
          uvx --from pip-audit==2.9.0 pip-audit \
            --requirement /tmp/anneal-requirements.txt --strict \
            --ignore-vuln PYSEC-2026-2447

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Typecheck (mypy)
        run: uv run mypy core/src worker/src shared/src sdk/src

      - name: Test (pytest)
        run: uv run pytest -v

      - name: Verify generated schemas
        run: |
          uv run python shared/generate_schemas.py
          git diff --exit-code -- shared/schemas

  dashboard:
    name: Dashboard — audit, test, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

  containers:
    name: Container — ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            context: .
            dockerfile: core/Dockerfile
          - name: worker
            context: .
            dockerfile: worker/Dockerfile
          - name: dashboard
            context: dashboard
            dockerfile: dashboard/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
